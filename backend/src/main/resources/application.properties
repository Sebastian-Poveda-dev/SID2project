spring.application.name=uniplan

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uniplan}
spring.datasource.username=${DB_USERNAME:uniplan}
spring.datasource.password=${DB_PASSWORD:uniplan}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/uniplan}

# JWT — override with environment variables in production
jwt.secret=${JWT_SECRET:uniplan-default-dev-secret-key-must-be-at-least-32-characters-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
