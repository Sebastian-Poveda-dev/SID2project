spring.application.name=uniplan

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uniplan}
spring.datasource.username=${DB_USERNAME:uniplan}
spring.datasource.password=${DB_PASSWORD:uniplan}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Universidad institucional (read-only)
university.datasource.url=jdbc:postgresql://localhost:5432/university
university.datasource.username=uniplan
university.datasource.password=uniplan
university.datasource.driver-class-name=org.postgresql.Driver

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb+srv://uniplan:uniplan@sidiipf.5foshch.mongodb.net/uniplan_db?appName=SIDIIPF}
spring.data.mongodb.database=uniplan_db

# JWT — override with environment variables in production
jwt.secret=${JWT_SECRET:uniplan-default-dev-secret-key-must-be-at-least-32-characters-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Jackson — en Jackson 3.x las fechas se serializan como ISO-8601 por defecto
spring.jackson.time-zone=UTC
